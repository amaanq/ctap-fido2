[package]
name         = "ctap-fido2"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.100.0"
description  = "CTAP2 client for FIDO2 over USB HID with hmac-secret support."
readme       = "README.md"
repository   = "https://github.com/amaanq/ctap-fido2"
license      = "MIT"
keywords     = [ "ctap", "ctap2", "fido2", "hmac-secret", "webauthn" ]
categories   = [ "authentication", "cryptography", "hardware-support" ]

[dependencies]
aes           = "0.9.4"
base64        = "0.23.1"
ciborium      = "0.2.2"
ed25519-dalek = { version = "3.0.0", default-features = false }
hidapi        = "2.6.7"
hmac-sha256   = "1.1.15"
log           = "0.4.35"
p256          = { version = "0.14.0", features = [ "ecdh", "ecdsa" ] }
rand          = "0.10.4"
subtle        = "2.6.1"
zeroize       = { version = "1.9.1", features = [ "derive" ] }

[dev-dependencies]
hex = "0.4.3"

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering    = "allow"
arithmetic_side_effects           = "allow"
as_conversions                    = "allow"
big_endian_bytes                  = "allow"
default_numeric_fallback          = "allow"
definition_in_module_root         = "allow"
error_impl_error                  = "allow"
exhaustive_enums                  = "allow"
exhaustive_structs                = "allow"
expect_used                       = "allow"
field_scoped_visibility_modifiers = "allow"
implicit_return                   = "allow"
indexing_slicing                  = "allow"
inline_modules                    = "allow"
map_err_ignore                    = "allow"
missing_asserts_for_indexing      = "allow"
missing_docs_in_private_items     = "allow"
missing_inline_in_public_items    = "allow"
missing_trait_methods             = "allow"
mod_module_files                  = "allow"
module_name_repetitions           = "allow"
multiple_crate_versions           = "allow"
must_use_without_reason           = "allow"
needless_borrowed_reference       = "allow"
panic                             = "allow"
pub_with_shorthand                = "allow"
question_mark_used                = "allow"
ref_patterns                      = "allow"
separated_literal_suffix          = "allow"
shadow_reuse                      = "allow"
single_call_fn                    = "allow"
single_char_lifetime_names        = "allow"
std_instead_of_alloc              = "allow"
std_instead_of_core               = "allow"
tests_outside_test_module         = "allow"
unwrap_used                       = "allow"
wildcard_enum_match_arm           = "allow"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto   = "thin"
